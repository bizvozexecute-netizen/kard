name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install → lint → build → test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kadr
          POSTGRES_PASSWORD: kadr
          POSTGRES_DB: kadr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kadr -d kadr_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # версия берётся из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          CI: "true"
          # интеграционные тесты (@kadr/ledger) ходят в сервис postgres
          TEST_DATABASE_URL: postgresql://kadr:kadr@localhost:5432/kadr_test
